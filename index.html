<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mega Link Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="card">

            <h1>Mega Link Generator</h1>
            <p class="description">
                Generate and decode Mega download links.
            </p>

            <div class="mode-buttons">
                <button id="megaMode" class="mode active">
                    Mega → Direct
                </button>

                <button id="directMode" class="mode">
                    Direct → Mega
                </button>
            </div>

            <label for="urlInput">Mega URL</label>

            <input
                id="urlInput"
                type="text"
                placeholder="https://mega.nz/file/..."
                autocomplete="off"
            >

            <div class="buttons">

                <button id="generateBtn" class="primary">
                    Generate
                </button>

                <button id="copyBtn">
                    Copy
                </button>

                <button id="testBtn">
                    Test
                </button>

                <button id="downloadBtn" class="download">
                    Download
                </button>

            </div>

            <div id="status" class="status"></div>

            <div id="result" class="result hidden">

                <div class="result-row">
                    <span>File name</span>
                    <strong id="fileName">Unknown</strong>
                </div>

                <div class="result-row">
                    <span>File size</span>
                    <strong id="fileSize">Unknown</strong>
                </div>

                <div class="result-row">
                    <span>Download URL</span>
                    <input
                        id="resultUrl"
                        type="text"
                        readonly
                    >
                </div>

                <div class="estimates">

                    <h2>Estimated download time</h2>

                    <div id="estimatesList"></div>

                </div>

            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
