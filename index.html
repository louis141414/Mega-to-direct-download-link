<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Mega Direct Download</title>
    <link rel="stylesheet" href="styles.css"
  </head>
  <body>
    <div class="box">
      <h2>Mega Direct Download</h2>
      <div class="input-row">
        <input id="megaUrl" type="url" placeholder="https://mega.nz/file/...">
        <button onclick="getFileInfo()">Generate</button>
      </div>
      <div id="speedStatus"></div>
      <div id="loading">Loading...</div>
      <div id="error"></div>
    </div>
    <div id="results" class="box results">
      <div class="info-row">
        <span class="label">Name:</span>
        <span id="fileName" class="value"></span>
      </div>
      <div class="info-row">
        <span class="label">Size:</span>
        <span id="fileSize" class="value"></span>
      </div>
      <div class="info-row">
        <span class="label">Your Speed:</span>
        <span id="userSpeed" class="value"></span>
      </div>
      <div class="info-row">
        <span class="label">Download Time:</span>
        <span id="downloadTime" class="value"></span>
      </div>
      <button class="btn-download" onclick="downloadFile()">Download Now</button>
      <div class="link-container">
        <input id="directLink" type="text" readonly class="link-input">
        <button class="copy-btn" onclick="copyLink()">Copy</button>
      </div>
    </div>
	<script src="script.js"></script>
  </body>
</html>
